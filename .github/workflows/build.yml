name: Test and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests and frontend build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - run: python -m compileall -q backend launcher.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  windows:
    name: Package Windows x64
    needs: test
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pip install -r requirements.txt "pyinstaller>=6.0,<7.0"
      - run: python -m PyInstaller SteamToolbox.spec --distpath packaged --workpath build --noconfirm --clean
      - name: Verify executable and local health
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'packaged/SteamToolbox.exe'
          if (-not (Test-Path $exe)) { throw 'Missing Windows executable' }
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/api/health' -TimeoutSec 2
                if ($health.ok -eq $true) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'Packaged application did not pass HTTP health check' }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Create checksum
        shell: pwsh
        run: |
          $exe = 'packaged/SteamToolbox.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SteamToolbox.exe" | Set-Content -Encoding ascii 'packaged/SHA256SUMS.txt'
          "Windows SHA256: $hash" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: SteamToolbox-windows-x64
          path: |
            packaged/SteamToolbox.exe
            packaged/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  extension:
    name: Package browser extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build extension zip
        run: |
          mkdir -p packaged
          cd extension
          zip -r ../packaged/steam-toolbox-workshop-extension.zip . -x '.*' '*.log' '*.db'
      - uses: actions/upload-artifact@v4
        with:
          name: SteamToolbox-workshop-extension
          path: packaged/steam-toolbox-workshop-extension.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged build
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SteamToolbox-windows-x64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/SteamToolbox.exe
          generate_release_notes: true
